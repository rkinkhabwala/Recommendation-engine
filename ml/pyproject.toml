[project]
name = "recsys-ml"
version = "0.2.0"
description = "Offline training, evaluation and experiment analysis for the recommendation system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lightgbm>=4.5",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "confluent-kafka[avro,schemaregistry]>=2.6",
  "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
recsys-export = "recsys_ml.export:main"
recsys-train = "recsys_ml.train:main"
recsys-ab-report = "recsys_ml.ab_report:main"
recsys-promote = "recsys_ml.registry:main"
recsys-bench-dims = "recsys_ml.bench_embedding_dims:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recsys_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
