# Generated by deploy/k8s/generate.py — edit the generator, not this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics
data:
  topics.conf: |
    # Production topic definitions (deploy/k8s base). Same names/configs as topics.conf, sized for
    # ~50K events/s peak (docs/architecture.md section 4, docs/cost-report.md). RF=3; MSK broker default
    # min.insync.replicas=2 with producers on acks=all.
    #
    # Partition counts are fixed at creation: adding partitions to a keyed topic re-maps keys and breaks
    # per-key ordering and Streams state. Size for the max stream-processor scale:
    #   events.raw.v1: 48 = 12 pods x 4 threads (KEDA maxReplicaCount 12), ~1K events/s per partition.
    #   catalog.items.v1 and catalog.embeddings.v1 MUST have equal counts (KTable-KTable join).
    # name                    partitions  cleanup  configs
    events.raw.v1             48          delete   retention.ms=604800000,compression.type=zstd
    events.late.v1            6           delete   retention.ms=604800000,compression.type=zstd
    users.onboarding.v1       6           delete   retention.ms=259200000
    users.deletion.v1         6           delete   retention.ms=2592000000
    catalog.items.v1          12          compact  min.compaction.lag.ms=0
    catalog.embeddings.v1     12          compact  min.compaction.lag.ms=0,compression.type=zstd
    features.user.v1          48          compact  max.compaction.lag.ms=604800000,delete.retention.ms=86400000,compression.type=zstd
    features.item.v1          12          compact  max.compaction.lag.ms=604800000,compression.type=zstd
    features.trending.v1      1           compact  max.compaction.lag.ms=604800000
    recs.served.v1            24          delete   retention.ms=604800000,compression.type=zstd
    recs.attributed.v1        24          delete   retention.ms=604800000,compression.type=zstd
    embedding.dlq.v1          3           delete   retention.ms=1209600000
  create-topics.sh: |
    #!/usr/bin/env bash
    # Idempotently creates topics from topics.conf. Usage: create-topics.sh <bootstrap> <conf>
    set -euo pipefail
    BOOTSTRAP="${1:-kafka:29092}"
    CONF="${2:-/config/topics.conf}"
    RF="${REPLICATION_FACTOR:-1}"
    grep -vE '^\s*(#|$)' "$CONF" | while read -r name partitions cleanup configs; do
      args=(--bootstrap-server "$BOOTSTRAP" --create --if-not-exists --topic "$name"
            --partitions "$partitions" --replication-factor "$RF" --config "cleanup.policy=$cleanup")
      IFS=',' read -ra kvs <<< "${configs:-}"
      for kv in "${kvs[@]}"; do [[ -n "$kv" ]] && args+=(--config "$kv"); done
      kafka-topics "${args[@]}"
    done
    echo "Topics ready:"
    kafka-topics --bootstrap-server "$BOOTSTRAP" --list
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
