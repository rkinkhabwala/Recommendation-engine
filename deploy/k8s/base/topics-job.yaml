      containers:
      - name: create-topics
        image: confluentinc/cp-kafka:7.9.10
        command:
        - bash
        - /config/create-topics.sh
        - $(KAFKA_BOOTSTRAP)
        - /config/topics.conf
        env:
        - name: REPLICATION_FACTOR
          valueFrom:
            configMapKeyRef:
              name: recsys-config
              key: KAFKA_REPLICATION_FACTOR
        - name: KAFKA_BOOTSTRAP
          valueFrom:
            configMapKeyRef:
              name: recsys-config
              key: KAFKA_BOOTSTRAP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        configMap:
          name: kafka-topics
