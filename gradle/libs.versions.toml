[versions]
spring-boot = "3.5.16"
confluent = "7.9.9"
# Must match the Kafka version managed by the Spring Boot BOM; Confluent artifacts ask for "-ccs" builds.
kafka = "3.9.2"
avro = "1.12.2"
qdrant = "1.19.0"
grpc = "1.83.0"
resilience4j = "2.4.0"
archunit = "1.5.1"
spotless = "8.10.3"

[libraries]
# build-logic
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
avro-compiler = { module = "org.apache.avro:avro-compiler", version.ref = "avro" }

# platforms
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# libraries
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
confluent-avro-serializer = { module = "io.confluent:kafka-avro-serializer", version.ref = "confluent" }
confluent-streams-avro-serde = { module = "io.confluent:kafka-streams-avro-serde", version.ref = "confluent" }
qdrant-client = { module = "io.qdrant:client", version.ref = "qdrant" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-ratelimiter = { module = "io.github.resilience4j:resilience4j-ratelimiter", version.ref = "resilience4j" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
