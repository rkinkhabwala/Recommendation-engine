# Local stack: infrastructure + all services. `docker compose up -d --build`
# Ports: recommendation-api 8080, ingestion-api 8081, catalog-service 8082, stream-processor 8083,
# embedding-worker 8084, schema-registry 8085, Prometheus 9090, Grafana 3000, Qdrant 6333/6334.
x-service-env: &service-env
  KAFKA_BOOTSTRAP: kafka:29092
  SCHEMA_REGISTRY_URL: http://schema-registry:8081
  REDIS_URI: redis://redis:6379
  QDRANT_HOST: qdrant
  QDRANT_GRPC_PORT: "6334"
  RECS_API_KEYS: ${RECS_API_KEYS:-dev-key}
  # Cap glibc malloc arenas (untracked native RSS → OOM kills under load; see architecture R17).
  MALLOC_ARENA_MAX: "2"
  # Current embedding space + its embeddings topic. A re-embed (README: Re-embedding) builds a new
  # index and topic, then switches both here.
  RECS_INDEX_VERSION: ${RECS_INDEX_VERSION:-items_mock_512_v2}
  RECS_EMBEDDINGS_TOPIC: ${RECS_EMBEDDINGS_TOPIC:-catalog.embeddings.v1}
  LOG_FORMAT: ${LOG_FORMAT:-ecs}
  # Distributed tracing: OTLP/HTTP to Jaeger (UI http://localhost:16686).
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
  TRACING_SAMPLING: ${TRACING_SAMPLING:-0.1}

# Every container has a memory limit: without one each JVM sizes its heap from the whole Docker VM
# and the kernel OOM-kills the largest process under load.
x-service: &service
  restart: unless-stopped
  depends_on:
    kafka-init: {condition: service_completed_successfully}
    schema-registry: {condition: service_healthy}
    redis: {condition: service_healthy}
    qdrant: {condition: service_started}

services:
  kafka:
    image: confluentinc/cp-kafka:7.9.10
    hostname: kafka
    mem_limit: 1g
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_CLEANER_MIN_CLEANABLE_RATIO: 0.1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: -Xms256m -Xmx640m
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: confluentinc/cp-kafka:7.9.10
    depends_on: {kafka: {condition: service_healthy}}
    volumes: ["./config/kafka:/config:ro"]
    entrypoint: ["bash", "/config/create-topics.sh", "kafka:29092", "/config/topics.conf"]
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.10
    mem_limit: 512m
    depends_on: {kafka: {condition: service_healthy}}
    ports: ["8085:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    mem_limit: 640m
    # Redis is a rebuildable view of the compacted feature topics: no persistence needed locally.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.1
    mem_limit: 1g
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant-data:/qdrant/storage"]

  postgres:
    image: postgres:16-alpine
    mem_limit: 256m
    environment:
      POSTGRES_DB: recsys
      POSTGRES_USER: recsys
      POSTGRES_PASSWORD: recsys
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recsys -d recsys"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingestion-api:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, target: service, args: {SERVICE: ingestion-api}}
    image: recsys/ingestion-api:local
    mem_limit: 640m
    ports: ["8081:8081"]
    environment: *service-env

  catalog-service:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, target: service, args: {SERVICE: catalog-service}}
    image: recsys/catalog-service:local
    mem_limit: 640m
    ports: ["8082:8082"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      schema-registry: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      <<: *service-env
      POSTGRES_URL: jdbc:postgresql://postgres:5432/recsys

  stream-processor:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, target: service, args: {SERVICE: stream-processor}}
    image: recsys/stream-processor:local
    mem_limit: 2g
    hostname: stream-processor-1
    ports: ["8083:8083"]
    environment:
      <<: *service-env
      STREAMS_STATE_DIR: /tmp/recs-streams
      # Leave room for RocksDB's off-heap memory.
      JAVA_OPTS: -XX:MaxRAMPercentage=40 -XX:MaxDirectMemorySize=96m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
      # Shorter than prod (1h) so the long-term vector is visible quickly in local demos.
      RECS_LONG_TERM_EMIT_INTERVAL: ${RECS_LONG_TERM_EMIT_INTERVAL:-1m}
    volumes: ["streams-state:/tmp/recs-streams"]

  embedding-worker:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, target: service, args: {SERVICE: embedding-worker}}
    image: recsys/embedding-worker:local
    mem_limit: 768m
    ports: ["8084:8084"]
    environment:
      <<: *service-env
      # mock (default) needs no key. To use OpenAI: RECS_OPENAI_MODE=openai OPENAI_API_KEY=sk-...
      # and RECS_INDEX_VERSION=items_te3s_512_v1 (new collection; re-embeds the catalog).
      RECS_OPENAI_MODE: ${RECS_OPENAI_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RECS_EMBEDDING_MODEL: ${RECS_EMBEDDING_MODEL:-text-embedding-3-small}
      RECS_EMBEDDING_DIMS: ${RECS_EMBEDDING_DIMS:-512}

  enrichment-worker:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, target: service, args: {SERVICE: enrichment-worker}}
    image: recsys/enrichment-worker:local
    mem_limit: 640m
    ports: ["8086:8086"]
    environment:
      <<: *service-env
      CATALOG_URL: http://catalog-service:8082
      RECS_API_KEY: ${RECS_API_KEYS:-dev-key}
      # mock (default): deterministic lexicon/template LLM. openai: set OPENAI_API_KEY and RECS_CHAT_MODEL.
      RECS_OPENAI_MODE: ${RECS_OPENAI_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RECS_CHAT_MODEL: ${RECS_CHAT_MODEL:-gpt-5-mini}
      RECS_EXPLANATION_SAMPLE_PERCENT: ${RECS_EXPLANATION_SAMPLE_PERCENT:-20}
      SPRING_KAFKA_LISTENER_CONCURRENCY: "3" # one consumer thread per partition

  recommendation-api:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, target: service, args: {SERVICE: recommendation-api}}
    image: recsys/recommendation-api:local
    mem_limit: 1g
    ports: ["8080:8080"]
    environment:
      <<: *service-env
      RECS_MODEL_DIR: /models
      # Local default logs features for half of the requests so the learned ranker has data quickly.
      RECS_FEATURE_LOG_SAMPLE_RATE: ${RECS_FEATURE_LOG_SAMPLE_RATE:-0.5}
    volumes: ["./ml/models:/models:ro"]

  # Offline ML (docker compose --profile ml run --rm ml <command>):
  #   recsys-export --out data      Kafka -> Parquet (pseudonymized)
  #   recsys-train --domain song    LightGBM LambdaRank, offline eval, gated promotion
  #   recsys-ab-report --split control=0.5,lgbm_thompson=0.5
  ml:
    profiles: ["ml"]
    build: {context: ./ml}
    image: recsys/ml:local
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      EXPORT_HMAC_SECRET: ${EXPORT_HMAC_SECRET:-local-dev-only-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./ml/data:/app/data
      - ./ml/models:/app/models

  prometheus:
    image: prom/prometheus:v3.15.0
    mem_limit: 256m
    ports: ["9090:9090"]
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.34.1
    mem_limit: 128m
    ports: ["9093:9093"]
    volumes: ["./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    mem_limit: 512m
    ports: ["16686:16686", "4318:4318"]

  grafana:
    image: grafana/grafana:13.2.3
    mem_limit: 256m
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # docker compose --profile sim run --rm simulator all
  simulator:
    profiles: ["sim"]
    build: {context: ., dockerfile: docker/service.Dockerfile, target: simulator}
    image: recsys/event-simulator:local
    environment:
      INGEST_URL: http://ingestion-api:8081
      RECS_URL: http://recommendation-api:8080
      CATALOG_URL: http://catalog-service:8082
      RECS_API_KEY: ${RECS_API_KEYS:-dev-key}
    command: ["all"]

volumes:
  qdrant-data:
  pg-data:
  streams-state:
